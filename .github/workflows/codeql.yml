name: "CodeQL Analysis & PR Notification"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        id: codeql_analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Post CodeQL Success Comment to PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `### 🛡️ CodeQL Security Analysis: Passed ✅
            
            **Результат сканирования:**
            - **Языки:** \`JavaScript / TypeScript\`
            - **Набор правил:** \`security-extended\`, \`security-and-quality\`
            - **Статус:** Уязвимостей и нарушений безопасности не обнаружено.
            
            *Отчёт безопасности автоматически загружен во вкладку GitHub Security (Code Scanning).*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Post CodeQL Failure Alert to PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const alertBody = `### ⚠️ CodeQL Security Analysis: Warning / Failed ❌
            
            **Обнаружены потенциальные уязвимости или ошибки анализа:**
            - Пожалуйста, проверьте вкладку **GitHub Security** и логи Workflow для устранения проблем безопасности перед мерджем.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: alertBody
            });
